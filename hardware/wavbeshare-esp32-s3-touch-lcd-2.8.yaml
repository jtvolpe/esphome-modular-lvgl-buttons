---
# Waveshare ESP32-S3 Touch LCD 4" hardware configuration file
# https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-4

esphome:
  min_version: 2026.4.0
  project:
    name: "Waveshare.ESP32-S3-touch-lcd-2.8"
    version: "1.0"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

preferences:
  flash_write_interval: 5min

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: i2c_touch
    sda: GPIO1
    scl: GPIO3
    frequency: 400kHz
    scan: true

# pca9554:
#   id: expander

# touchscreen:
#   platform: gt911
#   i2c_id: bus_a
#   id: my_touchscreen
#   reset_pin:
#     pca9554: expander
#     number: 0
#   interrupt_pin: 16

touchscreen:
  - platform: cst328
    id: my_touchscreen
    display: my_display # Links to your existing display ID
    address: 0x1A
    i2c_id: i2c_touch
    interrupt_pin: GPIO4

# light:
