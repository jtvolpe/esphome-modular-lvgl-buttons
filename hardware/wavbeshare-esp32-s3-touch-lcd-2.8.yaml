# Special LVGL settings required for this display
lvgl:
  rotation: ${rotation | default("0")}

# Backlight control is required on GPIO5 to light up the display panel
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO5

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

# Core display parameters mapped to internal board connections
display:
  - platform: st7789v
    id: my_display
    model: "240x320"
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    spi_mode: 3
    # Waveshare's screen architecture requires color inversion for correct hex mapping
    invert_colors: true
    rotation: 90°
    lambda: |-
      it.fill(Color::BLACK);
      it.print(160, 120, id(my_font), Color::WHITE, TextAlign::CENTER, "Waveshare 2.8 Initialized!");

# Necessary dependencies for basic operation
font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 24

