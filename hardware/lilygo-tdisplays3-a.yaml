# lilygo tdisplays3 170px * 320px Smart Screen
#
# Hardware configuration file
---

esphome:
  min_version: 2026.4.0
  platformio_options:
    build_unflags: -Werror=all
    board_build.flash_mode: dio

# external_components:
#   - source: github://clydebarrow/esphome/esphome
#     components: [ ili9xxx, spi]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# The 8 parallel data lines are mapped under octal SPI type
spi:
  type: octal
  clk_pin: 8
  data_pins:
    - 39
    - 40
    - 41
    - 42
    - number: 45
      ignore_strapping_warning: true
    - number: 46
      ignore_strapping_warning: true
    - 47
    - 48

# PSRAM configuration required for the display framebuffer
psram:
  speed: 80MHz
  mode: octal

output:
  - platform: ledc
    frequency: 2000
    pin: GPIO38
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "LCD Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON
    icon: mdi:lightbulb-on

display:
  - platform: mipi_spi
    model: t-display-s3
    # rotation: 270
    # lambda: |-
    #   it.print(0, 0, id(font_main), "Hello ESPHome!");

# Special LVGL settings required for this display
lvgl:
  rotation: ${rotation | default("270")}

preferences:
  flash_write_interval: 5min

# power_supply:
#   - id: lcd_pwr
#     enable_on_boot: true
#     pin: GPIO15

i2c:
  - scl: 17
    sda: 18
    scan: false
    id: i2c_onboard
    frequency: 400kHz

touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin: 21
    transform:
      mirror_x: true
      swap_xy: true
    on_touch:
      lambda: |-
        ESP_LOGI("touch", "X=%d, Y=%d", touch.x, touch.y);

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "Button 1"
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
    name: "Button 2"

